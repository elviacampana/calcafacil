<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>CalcaFácil 2</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#11101b;color:white}header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#201b30}h1{font-size:20px;margin:0}button{border:0;border-radius:13px;padding:13px 15px;background:#7650d4;color:#fff;font-weight:650;font-size:15px;cursor:pointer}button.secondary{background:#393449}button:focus-visible,input:focus-visible{outline:3px solid #e4ccff}#stage{position:relative;width:100%;height:58dvh;min-height:300px;overflow:hidden;background:#292735;touch-action:none}video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}#drawing{position:absolute;left:50%;top:50%;max-width:none;max-height:none;transform-origin:center;pointer-events:none;user-select:none;-webkit-user-drag:none;display:none}#hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#e9defd;font-weight:700;pointer-events:none;background:linear-gradient(transparent,#17121c33)}#controls{padding:16px;display:grid;gap:15px}.buttons{display:flex;flex-wrap:wrap;gap:9px}.setting{display:grid;grid-template-columns:110px 1fr 54px;align-items:center;gap:10px;font-size:14px}.setting output{text-align:right}input[type=range]{width:100%;accent-color:#ad88ff}#message{font-size:13px;color:#ffcf92;min-height:20px}#floating{position:fixed;z-index:5;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 4px 20px #0009;display:none}body.focus #controls,body.focus header{display:none}body.focus #stage{height:100dvh}body.focus #floating{display:block}body.focus #hint{display:none}body.focus #enterFocus{display:none}#file{display:none}small{color:#c9c2d4;line-height:1.5}body.focus{overflow:hidden}
</style></head><body><header><h1>🎨 CalcaFácil 2</h1><button id="enterFocus">⛶ Modo dibujo</button></header><main><div id="stage"><video id="camera" autoplay playsinline muted></video><img id="drawing" alt="Imagen para calcar"><div id="hint">Activa la cámara y elige una imagen para empezar ✨</div></div><section id="controls"><div class="buttons"><button id="start">📷 Activar cámara</button><button id="choose">🖼️ Elegir imagen</button><input id="file" type="file" accept="image/*"><button class="secondary" id="switch">🔄 Cambiar cámara</button><button class="secondary" id="lock">🔓 Bloquear posición</button><button class="secondary" id="edges">✍️ Ver contornos</button><button class="secondary" id="center">⌖ Centrar</button></div><div class="setting"><label for="opacity">Transparencia</label><input id="opacity" type="range" min="0" max="100" value="55"><output id="opacityValue">55%</output></div><div class="setting"><label for="size">Tamaño</label><input id="size" type="range" min="20" max="300" value="100"><output id="sizeValue">100%</output></div><div class="setting"><label for="rotation">Rotación</label><input id="rotation" type="range" min="-180" max="180" value="0"><output id="rotationValue">0°</output></div><div id="message" role="status"></div><small>Arrastra la imagen con un dedo para acomodarla. Cuando esté lista, bloquea su posición y activa Modo dibujo. Para usar la cámara, abre esta página mediante HTTPS y concede el permiso del navegador.</small></section></main><button id="floating">☰ Mostrar controles</button><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const stage=$('stage'),img=$('drawing'),video=$('camera'),hint=$('hint'),msg=$('message');let stream=null,facing='environment',source=null,edgeMode=false,locked=false,dx=0,dy=0,drag=null;const values={opacity:$('opacity'),size:$('size'),rotation:$('rotation')};function update(){img.style.opacity=Number(values.opacity.value)/100;img.style.width=(Number(values.size.value)*0.8)+'%';img.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${values.rotation.value}deg)`;for(const key of Object.keys(values))$(key+'Value').textContent=values[key].value+(key==='rotation'?'°':'%')}Object.values(values).forEach(el=>el.addEventListener('input',update));update();function ready(){hint.style.display='none'}function status(t){msg.textContent=t}async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Abre CalcaFácil desde una dirección HTTPS en Chrome.');if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing}}});video.srcObject=stream;await video.play();ready();status('Cámara activada. Ahora elige tu imagen.')}catch(e){status('No se pudo activar la cámara: '+(e.name==='NotAllowedError'?'revisa el permiso de cámara de Chrome.':e.message))}}$('start').onclick=startCamera;$('switch').onclick=()=>{facing=facing==='environment'?'user':'environment';startCamera()};$('choose').onclick=()=>$('file').click();$('file').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(source)URL.revokeObjectURL(source);source=URL.createObjectURL(file);edgeMode=false;img.onload=()=>{img.style.display='block';ready();status('Imagen cargada. Puedes moverla con un dedo.');update()};img.src=source;$('edges').textContent='✍️ Ver contornos'});$('center').onclick=()=>{dx=0;dy=0;update()};$('lock').onclick=()=>{locked=!locked;$('lock').textContent=locked?'🔒 Desbloquear posición':'🔓 Bloquear posición';status(locked?'Posición bloqueada.':'Ya puedes mover la imagen.')};stage.addEventListener('pointerdown',e=>{if(locked||img.style.display==='none')return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,dx,dy};stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;dx=drag.dx+e.clientX-drag.x;dy=drag.dy+e.clientY-drag.y;update()});function stop(e){if(drag?.id===e.pointerId)drag=null}stage.addEventListener('pointerup',stop);stage.addEventListener('pointercancel',stop);$('enterFocus').onclick=()=>document.body.classList.add('focus');$('floating').onclick=()=>document.body.classList.remove('focus');$('edges').onclick=()=>{if(!source){status('Primero elige una imagen.');return}if(edgeMode){img.src=source;edgeMode=false;$('edges').textContent='✍️ Ver contornos';return}const original=new Image();original.onload=()=>{try{const c=document.createElement('canvas'),max=1200,scale=Math.min(1,max/Math.max(original.naturalWidth,original.naturalHeight));c.width=Math.max(1,Math.round(original.naturalWidth*scale));c.height=Math.max(1,Math.round(original.naturalHeight*scale));const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(original,0,0,c.width,c.height);const data=ctx.getImageData(0,0,c.width,c.height),a=data.data,w=c.width,h=c.height,gray=new Float32Array(w*h);for(let i=0;i<w*h;i++)gray[i]=a[i*4]*.299+a[i*4+1]*.587+a[i*4+2]*.114;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x,gx=-gray[p-w-1]+gray[p-w+1]-2*gray[p-1]+2*gray[p+1]-gray[p+w-1]+gray[p+w+1],gy=-gray[p-w-1]-2*gray[p-w]-gray[p-w+1]+gray[p+w-1]+2*gray[p+w]+gray[p+w+1],v=Math.hypot(gx,gy)>110?0:255,i=p*4;a[i]=a[i+1]=a[i+2]=v;a[i+3]=255}ctx.putImageData(data,0,0);img.src=c.toDataURL('image/png');edgeMode=true;$('edges').textContent='🖼️ Ver original';status('Contornos activados.')}catch(err){status('No se pudieron generar los contornos de esta imagen.')}};original.src=source};window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(source)URL.revokeObjectURL(source)})})();
</script></body></html>
